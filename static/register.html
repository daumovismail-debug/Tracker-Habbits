<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Привычки">
<title>Регистрация — Трекер Привычек</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/app-icon.png">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="login-icon" src="/static/favicon.svg" alt="">
    <div class="login-title">Регистрация</div>
    <div class="login-sub">Привычки будут привязаны к Telegram ID</div>
    <input type="number" id="uid" placeholder="Telegram ID" autocomplete="username" inputmode="numeric">
    <input type="password" id="pwd" placeholder="Придумайте пароль" autocomplete="new-password">
    <button class="btn primary" id="enter">Зарегистрироваться</button>
    <div class="login-err" id="err"></div>
    <div class="login-link">
      Не знаешь свой ID? Напиши <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a><br>
      <a href="/login">Уже есть аккаунт — войти</a>
    </div>
  </div>
</div>

<script src="/static/register.js"></script>
</body>
</html>
