<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Привычки">
<title>Трекер Привычек</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/app-icon.png">
</head>
<body>

<div id="app">
  <header>
    <div class="title"><img class="title-icon" src="/static/favicon.svg" alt="">Трекер Привычек</div>
    <div class="date" id="date">Загрузка…</div>
  </header>

  <div class="progress-hero" id="hero"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="today">Сегодня</button>
    <button class="tab" data-tab="stats">Статистика</button>
    <button class="tab" data-tab="settings">Настройки</button>
  </nav>

  <main>
    <section id="tab-today" class="panel"></section>
    <section id="tab-stats" class="panel hidden"></section>
    <section id="tab-settings" class="panel hidden"></section>
  </main>
</div>

<button class="fab" id="fab" title="Новая привычка" aria-label="Новая привычка">+</button>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-title">Новая привычка</div>
    <input type="text" id="m-name" maxlength="64" placeholder="Название привычки" autocomplete="off">
    <div class="set-row">
      <div>
        <div class="set-title">Прогрессия</div>
        <div class="set-hint">Цель растёт со временем</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="m-prog">
        <span class="slider"></span>
      </label>
    </div>
    <div id="m-prog-fields" class="hidden">
      <div class="set-row">
        <div class="set-title">Начальная цель</div>
        <input type="number" id="m-target" min="1" class="num" value="20">
      </div>
      <div class="set-row">
        <div class="set-title">Цикл (дней)</div>
        <input type="number" id="m-cycle" min="1" class="num" value="10">
      </div>
      <div class="set-row">
        <div class="set-title">Шаг прогрессии</div>
        <input type="number" id="m-step" min="0" class="num" value="2">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="m-cancel">Отмена</button>
      <button class="btn primary" id="m-create">Создать</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
