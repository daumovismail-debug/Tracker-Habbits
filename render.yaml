services:
  - type: web
    name: habit-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEB_USER_ID
        sync: false
      - key: WEB_PASSWORD
        sync: false
      - key: WEB_URL
        sync: false
      - key: TZ
        value: Asia/Aqtobe
